# Brings up the app and a MySQL 8 database together.
#
#   1. Copy .env.example to .env and set SESSION_SECRET (and a DB password).
#   2. docker compose up --build -d
#   3. docker compose exec app npm run db:reset      # first run only: schema + seed
#   4. open http://localhost:4000
#
# Data persists in the named volume, so it survives `docker compose down`.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-janaya_shop}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD:-rootpass}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-janaya_shop}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      # The container is plain HTTP inside the network; terminate TLS at a proxy
      # in front and set these there. Leave false unless this port is HTTPS.
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'true'
    ports:
      - '4000:4000'

volumes:
  dbdata:
